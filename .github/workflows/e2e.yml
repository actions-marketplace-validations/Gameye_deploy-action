# Manual end-to-end run of this action against a real Gameye environment.
# Needs a repository secret GAMEYE_API_TOKEN for an organization that owns `application`.
name: e2e
on:
  workflow_dispatch:
    inputs:
      application:
        description: Gameye application name
        required: true
      tag:
        description: An image tag that exists in the application's registry
        required: true
      region:
        description: Region(s) without a warm pool for the application, comma-separated; the smoke test runs in the first
        required: true
      wait-timeout:
        description: How long to wait for the tag in every region
        default: 15m
      environment:
        description: Gameye environment
        type: choice
        options: [sandbox, production]
        default: sandbox
permissions:
  contents: read
  deployments: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: deploy
        uses: ./
        with:
          api-token: ${{ secrets.GAMEYE_API_TOKEN }}
          environment: ${{ inputs.environment }}
          application: ${{ inputs.application }}
          tag: ${{ inputs.tag }}
          region: ${{ inputs.region }}
          wait-timeout: ${{ inputs.wait-timeout }}
          github-deployment: e2e-${{ inputs.environment }}
          smoke-test: true
          smoke-duration: 30s
          show-logs: always
      - run: echo "session ${{ steps.deploy.outputs.session-id }} on ${{ steps.deploy.outputs.host }}"
